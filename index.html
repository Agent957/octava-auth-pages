<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTAVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --forest: #1F3D2F; --ivory: #F6F4EF; --stone: #6B6F6A; }
  @media (prefers-color-scheme: dark) {
    :root { --forest: #4C8A68; --ivory: #121614; --stone: #8E968F; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: var(--ivory); color: var(--forest);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px; text-align: center;
  }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: var(--forest); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--stone); font-size: 15px; }
</style>
</head>
<body>
  <div>
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#F6F4EF" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" fill="#F6F4EF"/>
      </svg>
    </div>
    <h1>OCTAVA</h1>
    <p>Your money, in perspective.</p>
  </div>
</body>
</html>
